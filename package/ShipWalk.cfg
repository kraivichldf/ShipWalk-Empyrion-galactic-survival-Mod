# SHIPWALK 0.4.16, Empyrion build 5150.
# Passenger save/restore across logout is excluded from this public release.
# Dedicated manager and playfield workers start automatically.
# Multiplayer clients enable automatically after the ShipWalk server handshake.
# mod exs off stays off until mod exs on or restarting the game.
# Single-player still uses mod exs on.
# Detects CV/SV/HV ship context automatically, seated or on foot.
# Startup mode is selected by the runtime role; this is not a client auto-start switch.
Mode=Diagnostics
# Legacy option accepted for compatibility; release builds stay quiet.
Trace=false
# Legacy moving-world interior is excluded from this build.
PreserveInterior=false
# Moving exit is allowed only from a prepared ship's open seat.
AllowMovingSeatExit=true
# One-time motion preservation on the physics owner across a pilot's seat exit.
# Multiplayer ship physics runs on the gameplay playfield worker.
PreserveExitMomentum=true
